name: Generate Metrics

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_BOT }}
          user: seggewiss
          template: classic
          base: header, repositories
          plugin_languages: yes
          plugin_languages_limit: 8
          filename: github-metrics.svg
